// ... (Previous HTML and Style remain the same) ...

    <script src='//libtl.com/sdk.js' data-zone='9702412' data-sdk='show_9702412'></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            const userData = tg.initDataUnsafe.user;
            const defaultProfilePic40 = 'https://via.placeholder.com/40';
            const defaultProfilePic80 = 'https://via.placeholder.com/80';

            const navItems = document.querySelectorAll('.nav-item');
            const pages = document.querySelectorAll('.page');
            const watchAdBtn = document.getElementById('watch-ad-btn');
            const startEarningBtn = document.getElementById('start-earning-btn');
            const withdrawBtn = document.getElementById('withdraw-btn');
            const withdrawForm = document.getElementById('withdraw-form');
            const submitWithdrawBtn = document.getElementById('submit-withdraw-btn');
            const withdrawRequirementMessage = document.getElementById('withdraw-requirement-message');
            const minBalanceReq = document.getElementById('min-balance-req');
            const minReferralReq = document.getElementById('min-referral-req');
            const copyReferralBtn = document.getElementById('copy-referral-btn');
            const referralLinkDisplay = document.getElementById('referral-link-display');


            const DAILY_ADS_LIMIT = 50;
            const AD_REWARD = 2.02; // BDT per ad
            const MIN_WITHDRAW_AMOUNT = 1000;
            const MIN_REFERRALS_FOR_WITHDRAWAL = 15;
            const REFERRAL_REWARD = 5.00; // BDT per successful referral

            // Initialize totalReferrals if it doesn't exist
            if (!localStorage.getItem('earnings')) {
                localStorage.setItem('earnings', '0');
                localStorage.setItem('adsWatched', '0');
            }
            if (!localStorage.getItem('totalReferrals')) {
                localStorage.setItem('totalReferrals', '0'); // Ensure it starts at '0'
            }
            
            // Referral Link Generator Function
            function generateReferralLink(userId) {
                const botUsername = 'Onlinefreeincomeeveryday_bot'; 
                if (userId) {
                    return `https://t.me/${botUsername}?start=ref${userId}`;
                }
                return `https://t.me/${botUsername}`;
            }

            function updateUI() {
                const earnings = parseFloat(localStorage.getItem('earnings'));
                const adsWatched = parseInt(localStorage.getItem('adsWatched'));
                const referrals = parseInt(localStorage.getItem('totalReferrals') || '0'); // Always read referrals here
                const referralEarnings = referrals * REFERRAL_REWARD;
                
                const formattedEarnings = earnings.toFixed(2);
                const formattedReferralEarnings = referralEarnings.toFixed(2);
                
                const canWithdraw = earnings >= MIN_WITHDRAW_AMOUNT && referrals >= MIN_REFERRALS_FOR_WITHDRAWAL;

                if(userData) {
                    const fullName = `${userData.first_name || ''} ${userData.last_name || ''}`.trim();
                    document.getElementById('header-user-name').textContent = fullName || 'User';
                    document.getElementById('profile-user-name').textContent = fullName || 'User';
                    document.getElementById('profile-user-username').textContent = userData.username ? `@${userData.username}` : 'No username';
                    
                    if (userData.photo_url) {
                        const proxyUrl = 'https://api.allorigins.win/raw?url=';
                        const proxiedPhotoUrl = `${proxyUrl}${encodeURIComponent(userData.photo_url)}`;
                        
                        document.getElementById('header-profile-pic').src = proxiedPhotoUrl;
                        document.getElementById('profile-page-pic').src = proxiedPhotoUrl;
                    } else {
                        document.getElementById('header-profile-pic').src = defaultProfilePic40;
                        document.getElementById('profile-page-pic').src = defaultProfilePic80;
                    }
                }

                // Update Home Page (Total Referrals displayed here)
                document.getElementById('current-balance').textContent = `BDT ${formattedEarnings}`;
                document.getElementById('total-earnings').textContent = `BDT ${formattedEarnings}`;
                document.getElementById('ads-watched').textContent = adsWatched;
                document.getElementById('total-referrals').textContent = referrals; // <-- Home Page Update

                // Update Earn Page
                document.getElementById('ad-progress-text').textContent = `Completed: ${adsWatched} / ${DAILY_ADS_LIMIT}`;
                const progress = (adsWatched / DAILY_ADS_LIMIT) * 100;
                document.getElementById('ad-progress-bar').style.width = `${progress}%`;
                
                watchAdBtn.disabled = adsWatched >= DAILY_ADS_LIMIT;
                watchAdBtn.querySelector('span').textContent = adsWatched >= DAILY_ADS_LIMIT ? 'cancel' : 'play_circle_filled';
                if(adsWatched >= DAILY_ADS_LIMIT) watchAdBtn.childNodes[0].nodeValue = "দৈনিক সীমা পৌঁছে গেছে ";

                // Update Withdraw Page
                document.getElementById('withdraw-balance-display').textContent = `BDT ${formattedEarnings}`;
                submitWithdrawBtn.disabled = !canWithdraw;
                
                minBalanceReq.style.color = earnings >= MIN_WITHDRAW_AMOUNT ? 'var(--secondary-color)' : 'var(--danger-color)';
                minReferralReq.style.color = referrals >= MIN_REFERRALS_FOR_WITHDRAWAL ? 'var(--secondary-color)' : 'var(--danger-color)';
                
                if (!canWithdraw) {
                    if (earnings < MIN_WITHDRAW_AMOUNT && referrals < MIN_REFERRALS_FOR_WITHDRAWAL) {
                        submitWithdrawBtn.textContent = `BDT ${MIN_WITHDRAW_AMOUNT} এবং ${MIN_REFERRALS_FOR_WITHDRAWAL} রেফারেল প্রয়োজন`;
                    } else if (earnings < MIN_WITHDRAW_AMOUNT) {
                        submitWithdrawBtn.textContent = `ন্যূনতম BDT ${MIN_WITHDRAW_AMOUNT} প্রয়োজন`;
                    } else if (referrals < MIN_REFERRALS_FOR_WITHDRAWAL) {
                        submitWithdrawBtn.textContent = `${MIN_REFERRALS_FOR_WITHDRAWAL}টি সফল রেফারেল প্রয়োজন`;
                    }
                } else {
                    submitWithdrawBtn.textContent = 'Submit Withdraw Request';
                }

                // Update Profile Page (Total Referrals displayed here)
                document.getElementById('profile-balance').textContent = `BDT ${formattedEarnings}`;
                document.getElementById('profile-earnings').textContent = `BDT ${formattedEarnings}`;
                document.getElementById('profile-ads-watched').textContent = adsWatched;
                document.getElementById('profile-referrals').textContent = referrals; // <-- Profile Page Update

                // Update Refer Page
                if (referralLinkDisplay) {
                    if (userData && userData.id) {
                        const userId = userData.id;
                        const link = generateReferralLink(userId);
                        referralLinkDisplay.value = link;
                        document.getElementById('total-referrals-page').textContent = referrals;
                        document.getElementById('referral-earnings-display').textContent = `Total Referral Earnings: BDT ${formattedReferralEarnings}`;
                    } else {
                        referralLinkDisplay.value = "ERROR: Telegram App-এ লোড করুন। ইউজার ডাটা পাওয়া যায়নি।";
                        document.getElementById('total-referrals-page').textContent = 'N/A';
                        document.getElementById('referral-earnings-display').textContent = 'Cannot generate link.';
                    }
                }
            }

            function showPage(targetPageId) {
                navItems.forEach(nav => nav.classList.remove('active'));
                pages.forEach(page => page.classList.remove('active'));

                const activeNavItem = document.querySelector(`[data-page="${targetPageId}"]`);
                if (activeNavItem) activeNavItem.classList.add('active');
                
                const activePage = document.getElementById(targetPageId);
                if (activePage) activePage.classList.add('active');
            }

            // ... (Event listeners for navItems, startEarningBtn, withdrawBtn, copyReferralBtn, watchAdBtn, withdrawForm remain the same) ...

            navItems.forEach(item => {
                item.addEventListener('click', () => showPage(item.getAttribute('data-page')));
            });

            startEarningBtn.addEventListener('click', () => showPage('earn-page'));
            withdrawBtn.addEventListener('click', () => showPage('withdraw-page'));
            
            if (copyReferralBtn) {
                copyReferralBtn.addEventListener('click', () => {
                    const link = referralLinkDisplay.value;
                    if (link && link.startsWith('https://t.me/')) {
                         navigator.clipboard.writeText(link).then(() => {
                            tg.showAlert('রেফারেল লিংক কপি করা হয়েছে!');
                        }).catch(err => {
                            tg.showAlert('কপি করতে সমস্যা হয়েছে। অনুগ্রহ করে লিংকটি নিজে কপি করুন।');
                        });
                    } else {
                        tg.showAlert('সঠিক লিংক তৈরি হয়নি। অনুগ্রহ করে টেলিগ্রাম অ্যাপের মধ্যে আবার চেষ্টা করুন।');
                    }
                });
            }
            
            watchAdBtn.addEventListener('click', () => {
                if (parseInt(localStorage.getItem('adsWatched')) >= DAILY_ADS_LIMIT) {
                    tg.showAlert('আপনার দৈনিক বিজ্ঞাপনের সীমা পৌঁছে গেছে।');
                    return;
                }

                watchAdBtn.disabled = true;

                if (typeof show_9702412 === 'function') {
                    show_9702412().then(() => {
                        let earnings = parseFloat(localStorage.getItem('earnings')) + AD_REWARD;
                        let currentAdsWatched = parseInt(localStorage.getItem('adsWatched')) + 1;
                        
                        localStorage.setItem('earnings', earnings.toString());
                        localStorage.setItem('adsWatched', currentAdsWatched.toString());
                        
                        tg.showAlert(`বিজ্ঞাপনটি দেখার জন্য আপনি BDT ${AD_REWARD.toFixed(2)} পেয়েছেন!`);
                    }).catch(() => {
                        tg.showAlert('বিজ্ঞাপনটি দেখাতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
                    }).finally(() => {
                        updateUI();
                        watchAdBtn.disabled = false; 
                    });
                } else {
                    // Fallback for testing in browser without Telegram
                    let earnings = parseFloat(localStorage.getItem('earnings')) + AD_REWARD;
                    let currentAdsWatched = parseInt(localStorage.getItem('adsWatched')) + 1;
                    localStorage.setItem('earnings', earnings.toString());
                    localStorage.setItem('adsWatched', currentAdsWatched.toString());
                    alert(`(Test Mode) You earned BDT ${AD_REWARD.toFixed(2)}!`);
                    updateUI();
                    watchAdBtn.disabled = false;
                }
            });

            withdrawForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const amount = parseFloat(document.getElementById('withdraw-amount').value);
                const earnings = parseFloat(localStorage.getItem('earnings'));
                const referrals = parseInt(localStorage.getItem('totalReferrals') || '0');
                const canWithdraw = earnings >= MIN_WITHDRAW_AMOUNT && referrals >= MIN_REFERRALS_FOR_WITHDRAWAL;

                if (!canWithdraw) {
                    tg.showAlert(`উত্তোলনের জন্য আপনার BDT ${MIN_WITHDRAW_AMOUNT} এবং ${MIN_REFERRALS_FOR_WITHDRAWAL}টি সফল রেফারেল প্রয়োজন।`);
                    return;
                }
                
                if (amount < MIN_WITHDRAW_AMOUNT || amount > earnings) {
                    tg.showAlert(`পরিমাণটি সঠিক নয়। এটি অবশ্যই ন্যূনতম BDT ${MIN_WITHDRAW_AMOUNT} হতে হবে এবং আপনার ব্যালেন্সের বেশি হতে পারবে না।`);
                    return;
                }


                tg.showConfirm(`আপনি কি আপনার উইথড্র অনুরোধ জমা দিতে চান?`, (confirmed) => {
                    if (confirmed) {
                        let newEarnings = parseFloat(localStorage.getItem('earnings')) - amount;
                        localStorage.setItem('earnings', newEarnings.toString());
                        
                        tg.sendData(JSON.stringify({ 
                            type: 'withdrawal', 
                            amount: amount, 
                            method: document.getElementById('withdraw-method').value,
                            account: document.getElementById('account-number').value
                        }));
                        
                        withdrawForm.reset();
                        updateUI();
                        tg.showAlert('আপনার উইথড্র অনুরোধ সফলভাবে জমা হয়েছে।');
                    }
                });
            });
            
            // ==========================================================
            // === টেস্টিং ফাংশন: এটি কনসোল থেকে রেফারেল বাড়াতে সাহায্য করবে ===
            // ==========================================================
            window.simulateReferral = function(count = 1) {
                let currentReferrals = parseInt(localStorage.getItem('totalReferrals') || '0');
                let newReferrals = currentReferrals + count;
                localStorage.setItem('totalReferrals', newReferrals.toString());
                updateUI();
                alert(`Referral count increased to: ${newReferrals}`);
            };

            updateUI();
        });
    </script>
</body>
</html>
